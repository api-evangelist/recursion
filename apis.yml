description: Recursion (Recursion Pharmaceuticals, NASDAQ RXRX) is a clinical-stage
  TechBio company that industrializes drug discovery by combining wet-lab automation,
  proprietary biological and chemical datasets (over 50 petabytes), and machine learning
  in its Recursion Operating System. Its Valence Labs unit runs machine-learning research,
  and the company has published open datasets (RxRx) for the ML community. Recursion
  was surfaced as a portfolio company of DCVC, Obvious Ventures, and the SoftBank Vision
  Fund. As of this enrichment pass the company exposes no public developer API, developer
  portal, or machine-readable API artifacts; this profile records its identity and a
  live domain-security probe.
